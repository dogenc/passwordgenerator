name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.6,<7"

      - name: Tests und Selbsttest
        run: |
          python -m unittest discover -s tests -v
          python pwgen_gui.py --self-test

      - name: EXE bauen
        run: python -m PyInstaller --noconfirm --clean pwgen.spec

      - name: Release-Verzeichnis und Prüfsumme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force Release | Out-Null
          Copy-Item dist\PWGen-DGKN-Labs.exe Release\
          $hash = (Get-FileHash Release\PWGen-DGKN-Labs.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PWGen-DGKN-Labs.exe" | Out-File -Encoding ascii Release\SHA256SUMS.txt
          Get-Content Release\SHA256SUMS.txt

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PWGen-DGKN-Labs-windows
          path: Release/*
          if-no-files-found: error

      - name: An Release anhängen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Release/*
          generate_release_notes: true
